# Generate the Xcode project with: xcodegen (from this folder). See ../README.md.
name: CalenduelLink
options:
  bundleIdPrefix: com.calenduel
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: 8DGT7FKTPZ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  CalenduelLink:
    type: application
    platform: iOS
    sources: [App, Common, ../Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calenduel.ipadlink
        INFOPLIST_KEY_CFBundleDisplayName: Calenduel Link
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Calenduel Link
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft,
           UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Calenduel Link sends your iPad's screen to the Calenduel iPad helper on your Mac over Wi-Fi.
        NSBonjourServices: [_calenduel-ipad._tcp]
    entitlements:
      path: App/CalenduelLink.entitlements
      properties:
        com.apple.security.application-groups: [group.com.calenduel.ipadlink]
    dependencies:
      - target: Broadcast
  Broadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast, Common, ../Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calenduel.ipadlink.broadcast
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Calenduel
        NSLocalNetworkUsageDescription: Calenduel Link sends your iPad's screen to the Calenduel iPad helper on your Mac over Wi-Fi.
        NSBonjourServices: [_calenduel-ipad._tcp]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: Broadcast/Broadcast.entitlements
      properties:
        com.apple.security.application-groups: [group.com.calenduel.ipadlink]
